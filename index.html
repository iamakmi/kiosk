<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>출석 키오스크 (태블릿)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>
/* =====================================================================
   📱 입구 태블릿 전용 키오스크 (kiosk_tablet.html)
   - Apps Script 웹앱 화면은 구글이 감싸는 iframe에 카메라 권한이 없어서
     실시간 카메라가 켜지지 않음 → 이 파일을 https 주소에 올려 직접 열면
     전면(셀프) 카메라가 자동으로 켜짐. 출석은 웹앱의 kioskapi로 처리.
   - 🔒 웹앱 주소와 키는 이 파일에 넣지 않음. 태블릿에서 처음 한 번 입력하면
     그 기기에만 저장됨 (또는 원장님이 보내 준 '연결 링크'를 한 번 열기)
   - 연결 다시 하기: 주소 끝에 #setup 을 붙여 열기
   ===================================================================== */
function ktGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function ktSet(k, v) { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) {} }
/* 연결 링크(#c=...)로 열었으면 저장하고 주소창에서 지움 */
(function () {
  var m = /[#&]c=([^&]+)/.exec(location.hash || '');
  if (m) {
    try {
      var t = decodeURIComponent(escape(atob(decodeURIComponent(m[1]).replace(/-/g, '+').replace(/_/g, '/')))).split('|');
      if (/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(t[0]) && t[1]) { ktSet('kt_api', t[0]); ktSet('kt_key', t[1]); }
    } catch (e) {}
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { location.hash = ''; }
  }
})();
var KT_API = ktGet('kt_api');
var KT_KEY = ktGet('kt_key');
function ktCache() { try { return JSON.parse(localStorage.getItem('kt_cache') || '{}') || {}; } catch (e) { return {}; } }
function ktApi(action, params) {
  var q = 'mode=kioskapi&key=' + encodeURIComponent(KT_KEY) + '&action=' + encodeURIComponent(action);
  Object.keys(params || {}).forEach(function (k) { q += '&' + k + '=' + encodeURIComponent(params[k]); });
  var ctl = window.AbortController ? new AbortController() : null;
  var tm = setTimeout(function () { if (ctl) ctl.abort(); }, 25000);
  if (!KT_API || !KT_KEY) { clearTimeout(tm); setTimeout(function () { if (window.ktSetup) ktSetup(); }, 0); return Promise.reject(new Error('태블릿 연결 설정이 필요해요.')); }
  return fetch(KT_API + '?' + q + '&_=' + Date.now(), { method: 'GET', cache: 'no-store', redirect: 'follow', signal: ctl ? ctl.signal : undefined })
    .then(function (r) { clearTimeout(tm); if (!r.ok) throw new Error('서버 응답 ' + r.status); return r.json(); },
          function (e) { clearTimeout(tm); throw new Error(e && e.name === 'AbortError' ? '응답이 늦어요. 다시 해 주세요.' : '인터넷 연결을 확인해 주세요.'); });
}
/* google.script.run 흉내: 키오스크 출석에 쓰는 두 함수만 서버 API로 연결 */
var google = { script: { run: (function () {
  function Runner(ok, fail) { this._ok = ok; this._fail = fail; }
  Runner.prototype.withSuccessHandler = function (f) { return new Runner(f, this._fail); };
  Runner.prototype.withFailureHandler = function (f) { return new Runner(this._ok, f); };
  Runner.prototype._go = function (p) { var s = this._ok, f = this._fail; p.then(function (r) { if (s) s(r); }, function (e) { if (f) f(e); }); };
  Runner.prototype.kioskLookup = function (q) { this._go(ktApi('lookup', { q: q })); };
  Runner.prototype.kioskCheckIn = function (id) { this._go(ktApi('checkin', { id: id })); };
  function notHere() { this._go(Promise.reject(new Error('이 기능은 똑똑똑 앱(관리 화면)에서 해 주세요.'))); }
  Runner.prototype.kioskGetQrCards = notHere;
  Runner.prototype.saveKioskConfig = notHere;
  Runner.prototype.saveKioskConfigAdmin = notHere;
  return new Runner(null, null);
})() } };
</script>
<style>
  :root { --main:#1597e5; --ok:#00b894; --late:#e17055; --bg:#f0f8fe; --ink:#2d3436; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; font-family:'Noto Sans KR',sans-serif; background:var(--bg); color:var(--ink); overflow:hidden; user-select:none; }
  body { background:var(--bgimg, none), var(--bg); transition:background .5s; }
  /* 🎨 떠다니는 장식 (화면 꾸미기) — 카드 뒤로 */
  #kfx { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
  #kfx i { position:absolute; font-style:normal; line-height:1; opacity:.6; will-change:transform; }
  #kfx.fall i { top:-60px; animation:kfFall linear infinite; }
  #kfx.rise i { bottom:-60px; animation:kfRise linear infinite; }
  #kfx.twinkle i { animation:kfTw ease-in-out infinite; }
  @keyframes kfFall { 0% { transform:translate(0,0) rotate(0); } 50% { transform:translate(30px,55vh) rotate(160deg); } 100% { transform:translate(-20px,115vh) rotate(320deg); } }
  @keyframes kfRise { 0% { transform:translate(0,0); } 50% { transform:translate(-24px,-55vh); } 100% { transform:translate(20px,-115vh); } }
  @keyframes kfTw { 0%,100% { opacity:.12; transform:scale(.7); } 50% { opacity:.8; transform:scale(1.1); } }
  header, main { position:relative; z-index:1; }
  header .notice { flex:1; min-width:0; text-align:center; font-size:22px; font-weight:700; padding:0 18px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header .notice:empty { visibility:hidden; }
  .panel.off { display:none; }

  /* ── 상단 ── */
  header { height:84px; display:flex; align-items:center; justify-content:space-between; padding:0 28px; background:var(--main); color:#fff; }
  header .brand { display:flex; align-items:center; gap:14px; font-size:26px; font-weight:900; }
  header .brand img { height:52px; width:52px; border-radius:50%; background:#fff; object-fit:cover; }
  header .clock { text-align:right; line-height:1.15; }
  header .clock b { font-size:34px; }
  header .clock span { font-size:16px; opacity:.85; display:block; }

  /* ── 본문 2단 ── */
  main { height:calc(100% - 84px); display:flex; gap:24px; padding:24px; }
  .panel { flex:1; background:#fff; border-radius:28px; box-shadow:0 6px 24px rgba(108,92,231,.12); display:flex; flex-direction:column; align-items:center; padding:22px; min-width:0; }
  .panel h2 { margin:0 0 14px; font-size:26px; font-weight:900; }
  .panel h2 small { display:block; font-size:16px; font-weight:400; color:#888; text-align:center; margin-top:4px; }

  /* QR 카메라 */
  .cam { position:relative; width:100%; flex:1; max-height:520px; border-radius:22px; overflow:hidden; background:#222; display:flex; align-items:center; justify-content:center; }
  .cam video { width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
  .cam video.back { transform:none; }
  .cam .frame { position:absolute; width:58%; aspect-ratio:1; border:5px solid rgba(255,255,255,.9); border-radius:20px; box-shadow:0 0 0 2000px rgba(0,0,0,.25); }
  .cam .msg { position:absolute; color:#fff; font-size:18px; text-align:center; padding:20px; line-height:1.6; white-space:pre-line; }
  .camBtns { margin-top:12px; display:flex; gap:10px; }
  .camBtns button { border:none; background:#eee; border-radius:12px; padding:10px 18px; font-size:16px; font-family:inherit; }

  .snapBtn { position:absolute; bottom:22px; display:none; border:none; background:#fff; color:var(--main); font-family:inherit; font-size:24px; font-weight:900; padding:18px 30px; border-radius:18px; box-shadow:0 4px 16px rgba(0,0,0,.3); }

  /* 번호 키패드 */
  .dots { display:flex; gap:16px; margin:6px 0 20px; }
  .dots i { width:58px; height:70px; border-radius:16px; background:color-mix(in srgb, var(--main) 6%, #fff); display:flex; align-items:center; justify-content:center; font-style:normal; font-size:40px; font-weight:900; color:var(--main); border:3px solid color-mix(in srgb, var(--main) 22%, #fff); }
  .dots i.on { border-color:var(--main); }
  .pad { display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; width:100%; max-width:430px; }
  .pad button { height:82px; border:none; border-radius:20px; background:color-mix(in srgb, var(--main) 9%, #fff); font-size:36px; font-weight:700; font-family:inherit; color:var(--ink); }
  .pad button:active { background:color-mix(in srgb, var(--main) 24%, #fff); transform:scale(.97); }
  .pad .fn { font-size:22px; background:#eee; }

  /* 오버레이 (학생 선택 / 결과) */
  .ov { position:fixed; inset:0; background:rgba(30,25,60,.55); display:none; align-items:center; justify-content:center; z-index:50; }
  .ov.show { display:flex; }
  .card { background:#fff; border-radius:32px; padding:40px 44px; text-align:center; min-width:min(560px,92vw); max-width:92vw; max-height:90vh; overflow:auto; }
  .card h3 { margin:0 0 22px; font-size:28px; }
  .pick { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:14px; }
  .pick button { border:3px solid color-mix(in srgb, var(--main) 22%, #fff); background:color-mix(in srgb, var(--main) 4%, #fff); border-radius:22px; padding:22px 10px; font-family:inherit; font-size:30px; font-weight:900; color:var(--ink); }
  .pick button small { display:block; font-size:16px; font-weight:400; color:#888; margin-top:6px; }
  .cancel { margin-top:22px; border:none; background:#eee; border-radius:14px; padding:14px 34px; font-size:20px; font-family:inherit; }
  .result .icon { font-size:96px; line-height:1; }
  /* 😊 등록된 얼굴 사진 */
  .result .face { position:relative; display:inline-block; }
  .result .face img { width:170px; height:170px; border-radius:50%; object-fit:cover; border:6px solid #fff; box-shadow:0 0 0 5px var(--ok), 0 10px 24px rgba(0,0,0,.18); animation:faceIn .5s cubic-bezier(.2,1.5,.4,1) both; }
  .result.late .face img { box-shadow:0 0 0 5px var(--late), 0 10px 24px rgba(0,0,0,.18); }
  .result .face b { position:absolute; right:-6px; bottom:-4px; font-size:52px; line-height:1; }
  @keyframes faceIn { from { transform:scale(.4); opacity:0; } to { transform:scale(1); opacity:1; } }
  .pick button img { display:block; width:96px; height:96px; border-radius:50%; object-fit:cover; margin:0 auto 10px; border:3px solid #e0dcff; }
  .result .name { font-size:52px; font-weight:900; margin:14px 0 6px; }
  .result .stat { font-size:34px; font-weight:900; }
  .result .sub { font-size:20px; color:#777; margin-top:10px; white-space:pre-line; }
  .result.ok .stat { color:var(--ok); }
  .result.late .stat { color:var(--late); }
  .result.err .stat { color:#d63031; font-size:28px; white-space:pre-line; }
  .result .bonus { margin-top:14px; font-size:26px; font-weight:900; color:#16a34a; }
  .result .pts { margin-top:16px; display:inline-block; font-size:26px; font-weight:900; color:#d97706; background:#fffbeb; border:2px solid #fde68a; border-radius:16px; padding:10px 20px; }
  .loading { font-size:26px; font-weight:700; color:#fff; }

  /* 관리자 / QR카드 */
  #adminBtn { position:fixed; right:10px; bottom:8px; border:none; background:none; color:#bbb; font-size:13px; z-index:5; }
  #qrPage { display:none; position:fixed; inset:0; background:#fff; overflow:auto; z-index:80; padding:20px; user-select:text; }
  #qrPage .bar { display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
  #qrPage .bar button, #qrPage .bar select { padding:10px 18px; font-size:16px; border-radius:10px; border:1px solid #ccc; background:#fff; font-family:inherit; }
  #qrPage .bar .pr { background:var(--main); color:#fff; border:none; }
  .qrgrid { display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; }
  .qrc { border:1.5px dashed #aaa; border-radius:10px; padding:0 6px 10px; overflow:hidden; text-align:center; page-break-inside:avoid; break-inside:avoid; }
  .qrc .hd { display:flex; align-items:center; justify-content:center; gap:8px; margin:0 -6px 6px; padding:8px 6px; background:#2e2b6f; color:#fff; font-size:15px; font-weight:900; letter-spacing:-.3px; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .qrc .hd img { width:34px; height:34px; border-radius:50%; background:#fff; object-fit:cover; flex-shrink:0; }
  .qrc .lb { font-size:10px; color:#999; margin-top:2px; }
  .qrc svg, .qrc img { width:120px; height:120px; }
  .qrc .nm { font-size:20px; font-weight:900; }
  .qrc .dv { font-size:12px; color:#777; }

  /* 세로 화면(폰·세로 태블릿) */
  @media (orientation:portrait), (max-width:820px) {
    html,body { overflow:auto; }
    main { flex-direction:column; height:auto; padding:14px; gap:14px; }
    .cam { min-height:300px; max-height:380px; }
    header { height:70px; padding:0 16px; }
    header .brand { font-size:20px; }
    header .clock b { font-size:26px; }
    .pad button { height:70px; }
  }
  /* 🎨 화면 꾸미기 (관리자) */
  #kdPanel { display:none; position:fixed; top:0; right:0; bottom:0; width:min(420px,100vw); background:#fff; z-index:90; box-shadow:-10px 0 30px rgba(0,0,0,.25); overflow:auto; padding:16px 18px 30px; user-select:text; font-size:14px; }
  #kdPanel h3 { margin:0 0 4px; font-size:19px; display:flex; justify-content:space-between; align-items:center; }
  #kdPanel .sec { font-weight:900; font-size:14px; margin:16px 0 8px; padding-top:12px; border-top:1px solid #eee; }
  #kdPanel .hint { color:#888; font-size:12px; }
  #kdPanel .chips { display:grid; grid-template-columns:repeat(2,1fr); gap:6px; }
  #kdPanel .chips button { display:flex; align-items:center; gap:6px; border:2px solid #ece6e1; background:#fff; border-radius:12px; padding:8px; font-family:inherit; font-size:13px; font-weight:700; text-align:left; cursor:pointer; }
  #kdPanel .chips button.on { border-color:var(--main); box-shadow:0 0 0 3px color-mix(in srgb, var(--main) 20%, #fff); }
  #kdPanel .chips i { flex:none; width:22px; height:22px; border-radius:50%; font-style:normal; display:flex; align-items:center; justify-content:center; font-size:12px; }
  #kdPanel .chips .wide { grid-column:1 / -1; }
  #kdPanel label.f { display:block; margin-bottom:8px; font-size:13px; color:#444; }
  #kdPanel label.f input:not([type=checkbox]):not([type=color]):not([type=range]), #kdPanel select { width:100%; margin-top:3px; padding:8px 10px; border:1px solid #ddd5cf; border-radius:10px; font-family:inherit; font-size:14px; }
  #kdPanel .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:8px; font-size:13px; }
  #kdPanel input[type=color] { width:40px; height:32px; padding:1px; border:1px solid #ddd5cf; border-radius:8px; vertical-align:middle; }
  #kdPanel .btn { border:1px solid #ddd5cf; background:#fff; border-radius:10px; padding:8px 12px; font-family:inherit; font-size:13px; font-weight:700; cursor:pointer; }
  #kdPanel .btn.pr { background:var(--main); border-color:var(--main); color:#fff; }
  body.kmanage header, body.kmanage main { margin-right:min(420px,100vw); }   /* 관리 페이지: 미리보기가 꾸미기 창에 가리지 않게 */
  body.kmanage #adminBtn { display:none; }
  body.kmanage.kpreview header, body.kmanage.kpreview main { margin-right:0; }   /* '키오스크' 메뉴: 미리보기만 (꾸미기 창 없음) */
  #kdPanel .foot { position:sticky; bottom:-30px; background:#fff; padding:12px 0 6px; margin-top:14px; border-top:1px solid #eee; display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; }
  @media print {
    body { overflow:visible; background:#fff; }
    header, main, #adminBtn, .ov, #qrPage .bar, #kfx, #kdPanel { display:none !important; }
    #qrPage { position:static; display:block !important; padding:0; }
    .qrgrid { grid-template-columns:repeat(4, 1fr); }
  }
  /* iOS 15 사파리는 color-mix()를 몰라 버튼 배경이 사라짐 → 대체 색 */
  @supports not (background: color-mix(in srgb, red 50%, #fff)) {
    .dots i { background:#f3f4f7; }
    .pad button { background:#eceef3; }
    .pad button:active { background:#d9dde6; }
    .pick button { border-color:#dfe2ea; background:#f8f9fb; }
    #kdPanel .chips button.on { box-shadow:0 0 0 3px rgba(0,0,0,.12); }
  }
</style>

<body>
<div id="kfx"></div>
<header>
  <div class="brand">
    <img id="kLogo" alt="" style="display:none">
    <span id="kIcon"></span><span id="kTitle">출석</span>
  </div>
  <div class="notice" id="kNotice"></div>
  <div class="clock" id="clkBox"><b id="clk">--:--</b><span id="dt"></span></div>
</header>

<main>
  <section class="panel" id="pQr">
    <h2><span id="tQr">QR카드를 보여주세요</span><small id="tQrSub">네모 칸 안에 카드를 대면 자동으로 출석돼요</small></h2>
    <div class="cam" id="cam">
      <video id="vid" playsinline muted></video>
      <div class="frame" id="frame" style="display:none"></div>
      <div class="msg" id="camMsg">카메라 준비 중…</div>
      <button class="snapBtn" id="snapBtn" onclick="document.getElementById('snap').click()">📷 눌러서 QR카드 찍기</button>
      <input type="file" id="snap" accept="image/*" capture="user" style="display:none" onchange="snapRead(this)">
    </div>
    <div class="camBtns">
      <button onclick="flipCam()">카메라 전환</button>
      <button onclick="startCam()">다시 켜기</button>
    </div>
  </section>

  <section class="panel" id="pNum">
    <h2><span id="tNum">또는 번호 입력</span><small id="tNumSub">부모님 전화번호 뒷자리 4개</small></h2>
    <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
    <div class="pad">
      <button onclick="press('1')">1</button><button onclick="press('2')">2</button><button onclick="press('3')">3</button>
      <button onclick="press('4')">4</button><button onclick="press('5')">5</button><button onclick="press('6')">6</button>
      <button onclick="press('7')">7</button><button onclick="press('8')">8</button><button onclick="press('9')">9</button>
      <button class="fn" onclick="clearNum()">지우기</button><button onclick="press('0')">0</button><button class="fn" onclick="backNum()">←</button>
    </div>
  </section>
</main>

<!-- 처리중 -->
<div class="ov" id="ovLoad"><div class="loading">확인 중…</div></div>
<!-- 학생 선택 -->
<div class="ov" id="ovPick"><div class="card"><h3>누구인가요?</h3><div class="pick" id="pickList"></div><button class="cancel" onclick="closeAll()">취소</button></div></div>
<!-- 결과 -->
<div class="ov" id="ovRes" onclick="closeAll()"><div class="card result" id="resCard"></div></div>

<button id="adminBtn" onclick="openAdmin()">관리자</button>

<!-- QR카드 인쇄 -->
<div id="qrPage">
  <div class="bar">
    <button onclick="closeQr()">← 닫기</button>
    <button class="pr" onclick="openDesign()" style="background:#f59e0b">🎨 화면 꾸미기</button>
    <select id="qrDiv" onchange="renderQr()"></select>
    <button class="pr" onclick="window.print()">인쇄</button>
    <span style="color:#888;font-size:14px">A4 한 장에 4열 · 점선을 따라 잘라 사용하세요</span>
  </div>
  <div class="qrgrid" id="qrGrid"></div>
</div>

<div id="kdPanel"></div>

<script>
  // ── 공통 상태 ──
  var KT_CACHE = ktCache();   // 지난번에 받아 둔 학원 이름·로고·화면 설정 (인터넷이 느려도 바로 보이게)
  var ACADEMY = KT_CACHE.academyName || '';
  var LOGO = KT_CACHE.logoUrl || '';   // 시스템 설정의 학원 로고
  var num = '';
  var busy = false;
  var lastScan = { text:'', at:0 };
  var facing = 'user';      // 입구 태블릿: 전면 카메라 기본
  var stream = null, detector = null, canvas = document.createElement('canvas'), ctx = canvas.getContext('2d', { willReadFrequently:true });
  var resTimer = null;

  // ── 시계 ──
  function tick() {
    var d = new Date(), w = ['일','월','화','수','목','금','토'][d.getDay()];
    document.getElementById('clk').textContent = ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
    document.getElementById('dt').textContent = (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + w + ')';
  }
  tick(); setInterval(tick, 10000);

  // ── 키패드 ──
  function drawDots() {
    var is = document.querySelectorAll('#dots i');
    for (var k = 0; k < 4; k++) { is[k].textContent = num[k] || ''; is[k].className = num[k] ? 'on' : ''; }
  }
  function press(n) {
    if (busy || num.length >= 4) return;
    num += n; drawDots();
    if (num.length === 4) setTimeout(function () { lookup(num); }, 150); // 4자리면 자동 조회
  }
  function backNum() { num = num.slice(0, -1); drawDots(); }
  function clearNum() { num = ''; drawDots(); }

  // ── 바코드 스캐너(USB/블루투스) 키보드 입력도 지원 ──
  var kbBuf = '', kbAt = 0;
  document.addEventListener('keydown', function (e) {
    if (document.getElementById('qrPage').style.display === 'block') return;
    var now = Date.now();
    if (now - kbAt > 300) kbBuf = '';
    kbAt = now;
    if (e.key === 'Enter') { if (kbBuf.length > 4) lookup(kbBuf); kbBuf = ''; return; }
    if (e.key.length === 1) kbBuf += e.key;
  });

  // ── 서버 호출 ──
  function show(id) { document.getElementById(id).classList.add('show'); }
  function hide(id) { document.getElementById(id).classList.remove('show'); }
  function closeAll() {
    ['ovLoad','ovPick','ovRes'].forEach(hide);
    clearTimeout(resTimer); busy = false; clearNum();
  }

  function lookup(text) {
    if (KMANAGE) { showErr('관리 화면이에요.\n여기서는 출석이 되지 않아요.'); return; }   // 관리 페이지 미리보기에서는 진짜 출석 안 함
    if (busy) return;
    busy = true; show('ovLoad');
    google.script.run
      .withSuccessHandler(function (r) {
        hide('ovLoad');
        if (!r || !r.success) return showErr(r && r.message);
        if (r.students.length === 1) return checkIn(r.students[0].id);
        // 같은 번호 학생이 여러 명 → 이름 선택
        var box = document.getElementById('pickList'); box.innerHTML = '';
        r.students.forEach(function (s) {
          var b = document.createElement('button');
          b.innerHTML = (s.face ? '<img src="' + s.face + '" alt="">' : '') + esc(s.name) + '<small>' + esc(s.division || '') + (s.classTime ? ' · 오늘 ' + s.classTime : '') + '</small>';
          b.onclick = function () { hide('ovPick'); checkIn(s.id); };
          box.appendChild(b);
        });
        show('ovPick');
        resTimer = setTimeout(closeAll, 20000);
      })
      .withFailureHandler(function (e) { hide('ovLoad'); showErr('연결 오류: ' + e.message); })
      .kioskLookup(text);
  }

  // ── 이미 출석한 친구가 또 찍을 때 멘트 (찍을 때마다 바뀜) ──
  // [아이콘, 화면 문구, 음성 멘트]  {n} 자리에 '이름+아/야' 가 들어감
  var ALREADY_MSGS = [
    ['🎨', '벌써 출석했어요!', '{n}, 너는 이미 출석 도장 쾅!'],
    ['😆', '출석 두 번은 반칙~', '{n}, 출석은 하루에 한 번만 해도 충분해!'],
    ['🧠', '이미 왔다고 기억하고 있어요', '{n}, 키오스크는 기억력이 좋아요~'],
    ['🖌️', '붓 들고 그림 그리러 가요!', '{n}, 출석은 끝! 이제 그림 그리러 가자!'],
    ['✔️', '출석 완료 ✔ 또 완료 ✔', '{n}, 두 번 찍어도 출석은 한 번이야~'],
    ['👯', '혹시 쌍둥이인가요?', '{n}, 아까 온 친구랑 똑같이 생겼네?'],
    ['🔥', '오늘도 열정 만점!', '{n}, 출석을 두 번이나 하다니 열정이 대단한데?'],
    ['🖍️', '크레파스가 기다려요', '{n}, 이미 출석했어! 크레파스가 기다리고 있어~'],
    ['⭐', '출석 스티커는 1장만!', '{n}, 오늘 스티커는 벌써 받았어요!'],
    ['👀', '선생님이 이미 알고 계세요', '{n}, 선생님이 벌써 너 온 거 알고 계셔~']
  ];
  var lastAlreadyIdx = -1;
  // 이름 뒤에 받침 있으면 '아', 없으면 '야' (예: 연승아, 지유야)
  function callName(name) {
    name = String(name || '').trim();
    var c = name.charCodeAt(name.length - 1);
    if (c >= 0xAC00 && c <= 0xD7A3) return name + (((c - 0xAC00) % 28) ? '아' : '야');
    return name;
  }
  function pickAlready(name) {
    var i;
    do { i = Math.floor(Math.random() * ALREADY_MSGS.length); } while (ALREADY_MSGS.length > 1 && i === lastAlreadyIdx);
    lastAlreadyIdx = i;
    var m = ALREADY_MSGS[i];
    return { icon: m[0], text: m[1], voice: m[2].replace('{n}', callName(name)) };
  }

  function checkIn(id) {
    clearTimeout(resTimer);
    show('ovLoad');
    google.script.run
      .withSuccessHandler(function (r) {
        hide('ovLoad');
        if (!r || !r.success) return showErr(r && r.message);
        showResult(r);
      })
      .withFailureHandler(function (e) { hide('ovLoad'); showErr('연결 오류: ' + e.message); })
      .kioskCheckIn(id);
  }
  // 출석 결과 화면 (화면 꾸미기의 미리보기에서도 씀)
  function showResult(r) {
        clearTimeout(resTimer);
        var C = (KC && KC.cfg) || {};
  // 하원 (등원 후 40분 지나서 다시 찍은 경우)
  if (r.checkout) {
    var oc = document.getElementById('resCard');
    var oi = r.alreadyOut ? '✅' : '👋';
    oc.className = 'card result ok';
    oc.innerHTML =
      (r.face ? '<div class="face"><img src="' + r.face + '" alt=""><b>' + oi + '</b></div>' : '<div class="icon">' + oi + '</div>') +
      '<div class="name">' + esc(r.name) + '</div>' +
      '<div class="stat">' + (r.alreadyOut ? '이미 하원했어요' : '하원 완료!') + '</div>' +
      '<div class="sub">등원 ' + esc(r.inTime || '-') + ' · 하원 ' + esc(r.time) + '</div>';

<script>
(function () {
  var main = document.querySelector('main'), tabs = document.getElementById('kswTabs'), idle = null;
  if (!main || !document.getElementById('pQr') || !document.getElementById('pNum')) return;
  function on() { return document.body.classList.contains('kswipe'); }
  function cur() { var p = document.getElementById('pNum'); return main.scrollLeft > (p.offsetLeft - main.offsetLeft) / 2 ? 'pNum' : 'pQr'; }
  function mark() { var c = cur(); Array.prototype.forEach.call(tabs.querySelectorAll('button'), function (b) { b.classList.toggle('on', b.getAttribute('data-ksw') === c); }); }
  function go(id, smooth) {
    var p = document.getElementById(id); if (!p) return;
    var x = p.offsetLeft - main.offsetLeft - (main.clientWidth - p.offsetWidth) / 2;
    try { main.scrollTo({ left: x, behavior: smooth === false ? 'auto' : 'smooth' }); } catch (e) { main.scrollLeft = x; }
  }
  function kick() {   // 번호 화면에서 45초 동안 아무것도 안 하면 QR 화면으로 돌아감
    clearTimeout(idle);
    if (on()) idle = setTimeout(function () { if (cur() === 'pNum') go('pQr'); }, 45000);
  }
  tabs.addEventListener('click', function (e) { var b = e.target.closest('[data-ksw]'); if (b) { go(b.getAttribute('data-ksw')); kick(); } });

    applyKiosk = function (cfg) { orig(cfg); window.kSwipeApply(cfg); };
  }

    if (!cfgOn() || !url()) return;
    if (busyNow()) { arm(); return; }
    if (!box.querySelector('iframe')) { var f = document.createElement('iframe'); f.src = url(); f.setAttribute('title', '칭찬 전광판'); box.insertBefore(f, box.firstChild); }
    box.classList.add('show');
  }
  function hide() { box.classList.remove('show'); arm(); }
  function arm() { clearTimeout(timer); if (cfgOn()) timer = setTimeout(show, WAIT); }
  window.kbIdleHide = hide;
  box.querySelector('.tap').addEventListener('click', hide);
  ['pointerdown', 'keydown', 'touchstart'].forEach(function (t) { document.addEventListener(t, function () { if (!box.classList.contains('show')) arm(); }, true); });
  if (typeof lookup === 'function') { var lk = lookup; lookup = function (t) { if (box.classList.contains('show')) box.classList.remove('show'); arm(); return lk.apply(this, arguments); }; }   // 전광판 중에도 QR을 비추면 바로 출석
  if (typeof applyKiosk === 'function') { var ak = applyKiosk; applyKiosk = function (cfg) { ak(cfg); if (!cfgOn()) box.classList.remove('show'); arm(); }; }
  arm();
})();
</script>
</body>
</html>
